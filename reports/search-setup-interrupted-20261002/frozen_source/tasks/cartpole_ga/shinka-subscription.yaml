# Use scripts/subscription_headless.py through SHINKA_HEADLESS_COMMAND.
# Native Headless 0.6.1 otherwise defaults to gpt-5.5; the guarded adapter resolves
# the local Codex model (or SHINKA_CODEX_MODEL) and includes it in usage output.
evo:
  task_sys_msg: |
    Optimize two static GA settings for continual CartPole using the fixed evaluator.
    The candidate must contain exactly def get_ga_config(): with no arguments,
    decorators, annotations, imports, or additional statements. Its only statement
    must return a literal dictionary containing sigma and elite_ratio.
    sigma must be finite in [0.001, 2.0]; elite_ratio in [0.05, 0.95].
    Preserve the EVOLVE-BLOCK markers. Larger combined_score is better.
    This is configuration search, not evolution of a learning algorithm.
    The smoke profile only verifies execution. Use the search profile for proposals.
    Return the requested patch directly; do not use tools or edit files yourself.
  llm_models: ["headless/codex?effort=medium"]
  llm_dynamic_selection: null
  llm_kwargs: {}
  embedding_model: null
  meta_rec_interval: null
  meta_llm_models: null
  novelty_llm_models: null
  evolve_prompts: false
  prompt_llm_models: null
  enable_wandb_logging: false
  max_novelty_attempts: 1
  max_patch_resamples: 1
  max_patch_attempts: 1
  patch_types: [diff, full]
  patch_type_probs: [0.8, 0.2]
  max_api_costs: null
  enable_controlled_oversubscription: false
  use_text_feedback: true
db:
  # A single archive is sufficient for this small two-parameter pilot and makes
  # generation counts and sequential checkpoints straightforward to inspect.
  num_islands: 1
  archive_size: 20
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
job:
  time: "02:00:00"
max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 1
