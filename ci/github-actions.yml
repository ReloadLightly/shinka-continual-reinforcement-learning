name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
