[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shinka-continual-reinforcement-learning"
version = "0.1.0"
description = "Continual neuroevolution reproduction harness and ShinkaEvolve experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
shinka = ["shinka-evolve @ git+https://github.com/SakanaAI/ShinkaEvolve.git@9912af12d423504b8d580f4179fd15f5f88b8c50"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shinka_crl = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Immutable adaptive-program evidence uses names supplied by the restricted
# compiler (clip, exp, stack, ...). Its grammar and receipts are checked by the
# evaluator/exporter; preserve the evaluated source without adding noqa lines.
[tool.ruff.lint.per-file-ignores]
"reports/adaptive-shinka-*/raw/evaluation/cache/*/attempt_*/program.py" = ["F821"]
"reports/adaptive-shinka-*/raw/search/shinka/gen_*/main.py" = ["F821"]
"reports/adaptive-shinka-*/raw/search/shinka/gen_*/original.py" = ["F821"]
"reports/adaptive-shinka-*/raw/search/shinka/best/main.py" = ["F821"]
